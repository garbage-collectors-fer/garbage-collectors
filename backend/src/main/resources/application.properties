spring.application.name=ecosentry

# Render zadaje port i stoji ispred aplikacije kao proxy (https)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Tajne (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET) cita se iz datoteke backend/.env, koja se ne commita.
spring.config.import=optional:file:.env[.properties]

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/{registrationId}/callback

# Kamo backend vraca korisnika nakon prijave
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# Baza podataka: lokalno H2 datoteka u backend/data/
spring.datasource.url=jdbc:h2:file:./data/ecosentry;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate sam stvara/azurira tablice prema entitetima
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Slike prijava: spremaju se kao datoteke, u bazi je samo URL
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB