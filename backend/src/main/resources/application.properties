spring.application.name=ecosentry

# Render zadaje port i stoji ispred aplikacije kao proxy (https)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Tajne (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET) cita se iz datoteke backend/.env, koja se ne commita.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/{registrationId}/callback

# Kamo backend vraca korisnika nakon prijave
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# Baza podataka: PostgreSQL na Neonu (podaci iz backend/.env)
spring.datasource.url=jdbc:postgresql://${DB_HOST}/neondb?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Shemu radi Flyway (db/migration), Hibernate je samo provjerava
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Neon se uspava kad nema prometa; pool ne drzi veze otvorenima
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000

# Slike prijava: Cloudinary, najveca velicina 10MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Slike prijava: Cloudinary (podaci iz backend/.env)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}